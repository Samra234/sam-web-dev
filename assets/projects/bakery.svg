<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bakeryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F130B"/>
      <stop offset="100%" stop-color="#3B2212"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bakeryBg)"/>
  <rect x="40" y="40" width="720" height="420" rx="16" fill="#181920" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Top Bar -->
  <rect x="40" y="40" width="720" height="48" rx="16" fill="#121318"/>
  <circle cx="70" cy="64" r="6" fill="#EF4444"/>
  <circle cx="90" cy="64" r="6" fill="#F59E0B"/>
  <circle cx="110" cy="64" r="6" fill="#10B981"/>
  <text x="400" y="69" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="600">Trust Bakers & Sweets | trustbakers.com</text>
  <!-- Content Mockup -->
  <text x="80" y="140" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="800">Fresh Artisan Bakery & Sweets</text>
  <text x="80" y="170" fill="#94A3B8" font-family="sans-serif" font-size="15">Handcrafted Cakes, Pastries, Fresh Bread & Traditional Mithai</text>
  <rect x="80" y="195" width="140" height="40" rx="8" fill="url(#accent)"/>
  <text x="150" y="220" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Order Online</text>
  <!-- Grid of Cards -->
  <rect x="80" y="260" width="200" height="160" rx="12" fill="#242530" stroke="rgba(255,255,255,0.05)"/>
  <text x="100" y="300" fill="#F59E0B" font-family="sans-serif" font-size="18" font-weight="700">🎂 Custom Cakes</text>
  <text x="100" y="330" fill="#94A3B8" font-family="sans-serif" font-size="12">Wedding & Birthday Specials</text>
  <rect x="300" y="260" width="200" height="160" rx="12" fill="#242530" stroke="rgba(255,255,255,0.05)"/>
  <text x="320" y="300" fill="#F59E0B" font-family="sans-serif" font-size="18" font-weight="700">🥐 Fresh Croissants</text>
  <text x="320" y="330" fill="#94A3B8" font-family="sans-serif" font-size="12">Butter & Chocolate Bakes</text>
  <rect x="520" y="260" width="200" height="160" rx="12" fill="#242530" stroke="rgba(255,255,255,0.05)"/>
  <text x="540" y="300" fill="#F59E0B" font-family="sans-serif" font-size="18" font-weight="700">🍯 Royal Sweets</text>
  <text x="540" y="330" fill="#94A3B8" font-family="sans-serif" font-size="12">Gulab Jamun, Barfi & More</text>
</svg>
